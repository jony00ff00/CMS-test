name: Deploy to GitHub Pages

# Which branch the site shows:
# - Run this workflow by hand (Actions → Deploy to GitHub Pages → Run workflow) and pick a branch: that branch is deployed.
# - On a push, only the branch named by the repository variable PAGES_BRANCH (Settings → Secrets and variables →
#   Actions → Variables) is deployed; without the variable, main. Pushes to other branches are skipped.
# The github-pages environment must allow the branch (Settings → Environments → github-pages → Deployment branches).
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == (vars.PAGES_BRANCH || 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
